# Zgodne z project.yaml — pilnuje tests/test_config_consistency.py
dataset: online_shoppers
data_mode: full

features:
  numeric:
    - Administrative
    - Administrative_Duration
    - Informational
    - Informational_Duration
    - ProductRelated
    - ProductRelated_Duration
    - BounceRates
    - ExitRates
    - SpecialDay
  categorical:
    - Month
    - OperatingSystems
    - Browser
    - Region
    - TrafficType
    - VisitorType
    - Weekend

split:
  strategy: stratified_random
  test_size: 0.2
  random_state: 42

model_package_path: data/06_models/model_package

production_model:
  name: ag_fast
  format: autogluon

experiments:
  enabled: true
  wandb_enabled: true
  wandb_project: null
  wandb_entity: null
  autogluon_configs:
    ag_fast:
      time_limit: 30
      presets: medium_quality
      hyperparameters:
        GBM: {}
        CAT: {}
    ag_good:
      time_limit: 60
      presets: good_quality
