# Zgodne z project.yaml — pilnuje tests/test_config_consistency.py
dataset: online_shoppers
data_mode: full

features:
  numeric:
    - Administrative
    - Administrative_Duration
    - Informational
    - Informational_Duration
    - ProductRelated
    - ProductRelated_Duration
    - BounceRates
    - ExitRates
    - SpecialDay
  categorical:
    - Month
    - OperatingSystems
    - Browser
    - Region
    - TrafficType
    - VisitorType
    - Weekend

split:
  strategy: stratified_random
  test_size: 0.2
  random_state: 42
